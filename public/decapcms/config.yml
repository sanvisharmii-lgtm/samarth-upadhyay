site:
  name: Samarth Upadhyay
  site: 'samarthupadhyay.com' # Update this with your actual domain
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: '' # Add yours if needed

metadata:
  title:
    default: Samarth Upadhyay
    template: '%s — Samarth Upadhyay'
  description: "Senior SEO Analyst specializing in Agentic Web optimization and technical architecture."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Samarth Upadhyay
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@yourhandle'
    site: '@yourhandle'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false # Disabled since you removed the blog

analytics:
  vendors:
    googleAnalytics:
      id: null 

ui:
  theme: 'system'